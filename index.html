<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>원우ENG MES POP - 공정 선택</title>
    <link rel="stylesheet" href="./process-select.css" />
    <link rel="stylesheet" href="./operator.css" />
  </head>
  <body>
    <main class="process-shell">
      <header class="process-header">
        <div class="company-brand">
          <img class="company-ci" src="./assets/wonwoo-ci.jpg" alt="원우ENG CI" />
          <strong class="company-name">원우ENG</strong>
        </div>
        <h1>원우ENG MES POP</h1>
        <div class="header-info">
          <span id="todayText">오늘 날짜</span><i aria-hidden="true"></i><span>작업자&nbsp; <b data-operator-name>조병철</b></span>
        </div>
      </header>

      <section class="process-content" aria-labelledby="processTitle">
        <h2 id="processTitle">작업할 공정을 선택하세요.</h2>
        <div class="process-grid">
          <a class="process-card inspection-card" href="./final-inspection.html">
            <span class="process-icon" aria-hidden="true">
              <svg viewBox="0 0 64 64"><path d="M14 46h36M19 39h26M22 18h20v17H22zM32 35v11M27 23h10M27 29h6" /></svg>
            </span>
            <strong>최종검사 공정</strong>
            <span class="process-description">무게 자동 I/F</span>
            <span class="select-action">선택하기 <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg></span>
          </a>

          <a class="process-card cutting-card" href="./cutting.html">
            <span class="process-icon" aria-hidden="true">
              <svg viewBox="0 0 64 64"><circle cx="32" cy="29" r="16" /><path d="M32 13v7M21 17l5 6M43 17l-5 6M16 28h8M40 28h8M19 45h26M15 51h34" /></svg>
            </span>
            <strong>절단 공정</strong>
            <span class="process-description">자재·잔재 관리</span>
            <span class="select-action">선택하기 <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg></span>
          </a>
        </div>
      </section>

      <footer class="system-strip">
        <div class="guide-icon" aria-hidden="true">i</div>
        <strong>원하는 공정을 선택하여 작업을 시작하세요.</strong>
        <div class="system-status"><span aria-hidden="true">✓</span> 시스템 정상</div>
        <time id="clockText">--:--:--</time>
      </footer>
    </main>
    <script src="./operator.js"></script>
    <script src="./process-select.js"></script>
  </body>
</html>
